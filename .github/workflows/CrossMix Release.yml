name: CrossMix-OS Release

permissions:
  id-token: "write"
  contents: "write"
  packages: "write"
  pull-requests: "read"

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

jobs:
  tagged-release:
    name: Tagged release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "BUILD_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Install 7-Zip
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          wget https://www.7-zip.org/a/7z2406-linux-x64.tar.xz -P "$RUNNER_TEMP/tools"
          tar xvf "$RUNNER_TEMP/tools/7z2406-linux-x64.tar.xz" -C "$RUNNER_TEMP/tools"
          sudo cp "$RUNNER_TEMP/tools/7zz" /usr/local/bin/

      - name: Extract RetroArch cores
        run: |
          find "${{ github.workspace }}/RetroArch/.retroarch/cores" -name "*.7z" -execdir 7zz x {} \; -execdir rm {} \;

      - name: Cleaning image...
        run: |
          find "${{ github.workspace }}" -type f -name ".gitkeep" -delete
          rm -rf "${{ github.workspace }}/_assets"
          rm -f "${{ github.workspace }}/LICENSE"
          rm -f "${{ github.workspace }}/README.md"
          rm -rf "${{ github.workspace }}/.git"
          rm -rf "${{ github.workspace }}/.github"
          cd "${{ github.workspace }}"
          /usr/local/bin/7zz a RetroArch/default_config.7z RetroArch/retroarch.cfg RetroArch/.retroarch/config/*

      - name: Zipping release
        run: |
          shopt -s dotglob
          cd "${{ github.workspace }}"
          zip -r "$RUNNER_TEMP/CrossMix-OS_v${{ env.BUILD_VERSION }}.zip" ./*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CrossMix-OS v${{ env.BUILD_VERSION }}"
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          prerelease: false
          draft: false
          files: "${{ runner.temp }}/CrossMix-OS_v${{ env.BUILD_VERSION }}.zip"
