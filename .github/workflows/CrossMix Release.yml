name: CrossMix-OS Release

permissions:
  id-token: "write"
  contents: "write"
  packages: "write"
  pull-requests: "read"

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

jobs:
  tagged-release:
    name: Tagged release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "BUILD_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Cleaning image...
        run: |
          find "${{ github.workspace }}" -type f -name ".gitkeep" -delete
          rm -rf "${{ github.workspace }}/_assets"
          rm -f "${{ github.workspace }}/LICENSE"
          rm -f "${{ github.workspace }}/README.md"
          rm -rf "${{ github.workspace }}/.git"
          rm -rf "${{ github.workspace }}/.github"

      - name: Zipping release
        run: |
          shopt -s dotglob
          cd "${{ github.workspace }}"
          zip -9 -r "$RUNNER_TEMP/CrossMix-OS_v${{ env.BUILD_VERSION }}.zip" ./*
          ls -lh "$RUNNER_TEMP/CrossMix-OS_v${{ env.BUILD_VERSION }}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CrossMix-OS Steam Edition v${{ env.BUILD_VERSION }}"
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          prerelease: false
          draft: false
          files: "${{ runner.temp }}/CrossMix-OS_v${{ env.BUILD_VERSION }}.zip"
